name: Build and Push Changed Backend Services to ECR

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  detect:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get Changed Backend Services
        id: set-matrix
        run: |
          echo "Detecting changed backend services..."
          SERVICES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | \
            grep '^backend/' | \
            grep -Ev '^backend/env/' | \
            awk -F/ '{print $2}' | \
            sort -u)

          echo "Changed services:"
          echo "$SERVICES"

          JSON=$(echo "$SERVICES" | jq -R . | jq -s .)
          # Strip leading spaces to make output parser-friendly
          echo "matrix=$(echo $JSON)" >> $GITHUB_OUTPUT

  build:
    name: Build & Push ${{ matrix.service }}
    needs: detect
    runs-on: ubuntu-latest
    if: needs.detect.outputs.matrix != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        env:
          ECR_BASE: ${{ secrets.ECR_REPOSITORY }}
        run: |
          IMAGE_URI="$ECR_BASE/${{ matrix.service }}"
          echo "Building Docker image for service: ${{ matrix.service }}"

          docker build -t $IMAGE_URI:${{ env.IMAGE_TAG }} ./backend/${{ matrix.service }}
          docker tag $IMAGE_URI:${{ env.IMAGE_TAG }} $IMAGE_URI:latest

          docker push $IMAGE_URI:${{ env.IMAGE_TAG }}
          docker push $IMAGE_URI:latest
