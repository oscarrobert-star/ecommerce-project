name: Build and Push Changed Backend Services to ECR and Deploy

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}
  ECS_CLUSTER_NAME: ecommerce-staging-cluster

jobs:
  detect:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get Changed Backend Services
        id: set-matrix
        run: |
          echo "Detecting changed backend services..."
          SERVICES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | \
            grep '^backend/' | \
            grep -Ev '^backend/env/' | \
            awk -F/ '{print $2}' | \
            sort -u | \
            grep -v '^$')

          echo "Changed services:"
          echo "$SERVICES"

          if [ -z "$SERVICES" ]; then
            JSON="[]"
          else
            JSON=$(echo "$SERVICES" | jq -R . | jq -s -c .)
          fi

          echo "matrix=$JSON" >> $GITHUB_OUTPUT

  build:
    name: Build & Push ${{ matrix.service }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.matrix || '[]') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and Push Image
        run: |
          IMAGE_URI="${{ secrets.ECR_REPOSITORY }}/${{ matrix.service }}"

          docker build -t $IMAGE_URI:${{ env.IMAGE_TAG }} ./backend/${{ matrix.service }}
          docker tag $IMAGE_URI:${{ env.IMAGE_TAG }} $IMAGE_URI:latest

          docker push $IMAGE_URI:${{ env.IMAGE_TAG }}
          docker push $IMAGE_URI:latest

          echo "{\"service\":\"${{ matrix.service }}\",\"image\":\"$IMAGE_URI:${{ env.IMAGE_TAG }}\"}" >> images.json

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.json

  deploy:
    name: Deploy ${{ matrix.service }} to ECS
    needs: build
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.matrix || '[]') }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download image metadata
        uses: actions/download-artifact@v4
        with:
          name: images

      - name: Read image for this service
        id: find-image
        run: |
          IMAGE=$(jq -r "select(.service == \"${{ matrix.service }}\") | .image" images.json)
          echo "Got image: $IMAGE"
          echo "IMAGE_URI=$IMAGE" >> $GITHUB_OUTPUT

      - name: Check if ECS Task Definition Exists
        id: check-td
        run: |
          EXISTS=$(aws ecs list-task-definitions \
            --family-prefix ${{ matrix.service }} \
            --status ACTIVE \
            --max-items 1 | jq '.taskDefinitionArns | length')

          if [ "$EXISTS" -eq 0 ]; then
            echo "ECS_RESOURCES_EXIST=false" >> $GITHUB_OUTPUT
          else
            echo "ECS_RESOURCES_EXIST=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to ECS
        if: steps.check-td.outputs.ECS_RESOURCES_EXIST == 'true'
        run: |
          TD=${{ matrix.service }}
          IMAGE_URI="${{ steps.find-image.outputs.IMAGE_URI }}"

          echo "Deploying $TD with $IMAGE_URI"

          aws ecs describe-task-definition --task-definition $TD \
            | jq --arg IMG "$IMAGE_URI" \
              '.taskDefinition |
              .containerDefinitions |= map(if .name == "'$TD'" then .image = $IMG else . end) |
              del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            > new-td.json

          NEW_TD=$(aws ecs register-task-definition --cli-input-json file://new-td.json --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --service ${TD}-service \
            --task-definition $NEW_TD \
            --force-new-deployment
          echo "Deployed $TD to ECS with new task definition $NEW_TD"