name: Build and Push Changed Backend Services to ECR and Deploy

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}
  # Define ECS Cluster/Service names once here for reuse
  ECS_CLUSTER_NAME: ecommerce-staging-cluster 
  
jobs:
  detect:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get Changed Backend Services
        id: set-matrix
        run: |
          echo "Detecting changed backend services..."
          SERVICES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | \
            grep '^backend/' | \
            grep -Ev '^backend/env/' | \
            awk -F/ '{print $2}' | \
            sort -u | \
            grep -v '^$')

          echo "Changed services:"
          echo "$SERVICES"

          if [ -z "$SERVICES" ]; then
            JSON="[]"
          else
            JSON=$(echo "$SERVICES" | jq -R . | jq -s -c .)
          fi

          echo "matrix=$JSON" >> $GITHUB_OUTPUT

  build:
    name: Build & Push ${{ matrix.service }}
    needs: detect
    runs-on: ubuntu-latest
    if: needs.detect.outputs.matrix != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and Push Image
        id: push-image
        env:
          # ECR_REPOSITORY likely holds the repository path (e.g., 'ecommerce-staging')
          # ECR_REPO_PATH: ${{ secrets.ECR_REPOSITORY }} 
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_BASE: ${{ secrets.ECR_REPOSITORY }}
        run: |
          aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 071046007207.dkr.ecr.us-east-2.amazonaws.com

          IMAGE_URI="$ECR_BASE/${{ matrix.service }}"
          echo "Building Docker image for service: ${{ matrix.service }}"

          docker build -t $IMAGE_URI:${{ env.IMAGE_TAG }} ./backend/${{ matrix.service }}
          docker tag $IMAGE_URI:${{ env.IMAGE_TAG }} $IMAGE_URI:latest

          docker push $IMAGE_URI:${{ env.IMAGE_TAG }}
          docker push $IMAGE_URI:latest

          IMAGE_FULL_URI="$IMAGE_URI:${{ env.IMAGE_TAG }}"
          echo "Image pushed: $IMAGE_FULL_URI"

          # Output the full image URI for the deploy job
          echo "IMAGE_FULL_URI=$IMAGE_FULL_URI" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy ${{ matrix.service }} to ECS
    needs: 
      - detect
      - build
    runs-on: ubuntu-latest
    if: needs.detect.outputs.matrix != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.matrix) }}
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check for existing ECS Service and get current Task Definition
        id: check-ecs-service
        env:
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          echo "Checking for ECS service: $SERVICE_NAME"
          
          # Check if the ECS service exists
          SERVICE_EXISTS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --services $SERVICE_NAME \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].status' \
            --output text)

          if [ "$SERVICE_EXISTS" != "ACTIVE" ]; then
            echo "::notice::ECS service $SERVICE_NAME not found or not active. Exiting gracefully."
            echo "ECS_SERVICE_EXISTS=false" >> $GITHUB_OUTPUT
          else
            echo "ECS service found: $SERVICE_NAME"
            
            # Get the current task definition from the service
            CURRENT_TASK_DEF=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --services $SERVICE_NAME \
              --region ${{ env.AWS_REGION }} \
              --query 'services[0].taskDefinition' \
              --output text)
            
            echo "Current task definition: $CURRENT_TASK_DEF"
            echo "CURRENT_TASK_DEF=$CURRENT_TASK_DEF" >> $GITHUB_OUTPUT
            echo "ECS_SERVICE_EXISTS=true" >> $GITHUB_OUTPUT
          fi

      - name: Get Image URI from Build Job
        id: get-image
        run: |
          # Access the output from the specific build job for this service
          echo "IMAGE_FULL_URI=${{ needs.build.outputs['IMAGE_FULL_URI'] }}" >> $GITHUB_OUTPUT

      - name: Deploy if ECS Service Exists
        if: steps.check-ecs-service.outputs.ECS_SERVICE_EXISTS == 'true'
        run: |
          SERVICE_NAME="${{ matrix.service }}"
          
          # The image URI is passed from the build job's output
          IMAGE_URI="${{ steps.get-image.outputs.IMAGE_FULL_URI }}"
          CURRENT_TASK_DEF="${{ steps.check-ecs-service.outputs.CURRENT_TASK_DEF }}"
          
          echo "Using image: $IMAGE_URI"
          echo "Current task definition: $CURRENT_TASK_DEF"
          
          # 1. Get the full task definition details using the ARN from the service
          echo "Getting current task definition details..."
          aws ecs describe-task-definition \
            --task-definition $CURRENT_TASK_DEF \
            --region ${{ env.AWS_REGION }} \
            > current-task-definition.json
          
          # 2. Render new task definition JSON with the new image URI
          echo "Updating task definition with new image..."
          CONTAINER_NAME="${{ matrix.service }}"
          
          jq --arg IMG_URI "$IMAGE_URI" --arg CONTAINER "$CONTAINER_NAME" \
            '.taskDefinition | 
            .containerDefinitions |= map(if .name == $CONTAINER then .image = $IMG_URI else . end) | 
            del(.taskDefinitionArn) | del(.revision) | del(.status) | del(.requiresAttributes) | del(.compatibilities) | del(.registeredAt) | del(.registeredBy)' \
            current-task-definition.json > rendered-task-definition.json
          
          echo "Updated task definition:"
          cat rendered-task-definition.json
          
          # 3. Register New Task Definition
          echo "Registering new task definition..."
          NEW_TD_ARN=$(aws ecs register-task-definition \
            --region ${{ env.AWS_REGION }} \
            --cli-input-json file://rendered-task-definition.json \
            | jq -r '.taskDefinition.taskDefinitionArn')
          
          echo "Registered new task definition: $NEW_TD_ARN"
          
          # 4. Force ECS Service Deployment
          echo "Updating ECS service: $SERVICE_NAME with new task definition: $NEW_TD_ARN"
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --service $SERVICE_NAME \
            --task-definition $NEW_TD_ARN \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          
          echo "Deployment initiated successfully for ${{ matrix.service }}."
          
          # 5. Wait for service to stabilize (optional but recommended)
          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --services $SERVICE_NAME \
            --region ${{ env.AWS_REGION }}
          
          echo "Service deployment completed and stabilized."