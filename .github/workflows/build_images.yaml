name: Build and Push Changed Backend Services to ECR and Deploy

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}
  # Define ECS Cluster/Service names once here for reuse
  ECS_CLUSTER_NAME: ecommerce-staging-cluster 
  
jobs:
  detect:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get Changed Backend Services
        id: set-matrix
        run: |
          echo "Detecting changed backend services..."
          SERVICES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | \
            grep '^backend/' | \
            grep -Ev '^backend/env/' | \
            awk -F/ '{print $2}' | \
            sort -u | \
            grep -v '^$')

          echo "Changed services:"
          echo "$SERVICES"

          if [ -z "$SERVICES" ]; then
            JSON="[]"
          else
            JSON=$(echo "$SERVICES" | jq -R . | jq -s -c .)
          fi

          echo "matrix=$JSON" >> $GITHUB_OUTPUT

  build:
    name: Build & Push ${{ matrix.service }}
    needs: detect
    runs-on: ubuntu-latest
    if: needs.detect.outputs.matrix != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and Push Image
        id: push-image
        env:
          # ECR_REPOSITORY likely holds the repository path (e.g., 'ecommerce-staging')
          ECR_REPO_PATH: ${{ secrets.ECR_REPOSITORY }} 
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          # Calculate the full ECR Registry URI (e.g., 12345.dkr.ecr.us-east-2.amazonaws.com)
          ECR_REGISTRY_URI="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          
          # Calculate the FULL Image Tag Prefix (Registry URI + Repo Path)
          IMAGE_TAG_PREFIX="$ECR_REGISTRY_URI/$ECR_REPO_PATH"

          # 1. ECR Login using the correct Registry URI
          echo "Logging into ECR: $ECR_REGISTRY_URI"
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin $ECR_REGISTRY_URI

          # 2. Define FULL image tags starting with the ECR domain
          IMAGE_URI="$IMAGE_TAG_PREFIX/${{ matrix.service }}"
          IMAGE_FULL_TAG="$IMAGE_URI:${{ env.IMAGE_TAG }}"

          echo "Building Docker image for service: ${{ matrix.service }}"
          docker build -t $IMAGE_FULL_TAG ./backend/${{ matrix.service }}
          docker tag $IMAGE_FULL_TAG $IMAGE_URI:latest

          # 3. Push using the fully qualified tags
          echo "Pushing $IMAGE_FULL_TAG"
          docker push $IMAGE_FULL_TAG
          docker push $IMAGE_URI:latest
          
          # Output the full image URI for the deploy job
          echo "IMAGE_FULL_URI=$IMAGE_FULL_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy ${{ matrix.service }} to ECS
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.matrix) }}
    
    # Use the output from the build job (via needs.build.outputs)
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check for existing ECS Task Definition (Graceful Exit)
        id: check-td
        env:
          TASK_DEFINITION_NAME: ${{ matrix.service }} 
        run: |
          echo "Checking for existing task definition: $TASK_DEFINITION_NAME"
          
          TASK_FAMILY_EXISTS=$(aws ecs list-task-definitions \
            --family-prefix $TASK_DEFINITION_NAME \
            --status ACTIVE \
            --region ${{ env.AWS_REGION }} \
            --max-items 1 \
            | jq -r '.taskDefinitionArns | length')

          if [ "$TASK_FAMILY_EXISTS" -eq 0 ]; then
            echo "::notice::ECS resources (Task Definition Family: $TASK_DEFINITION_NAME) not found. Exiting gracefully."
            echo "ECS_RESOURCES_EXIST=false" >> $GITHUB_OUTPUT
          else
            echo "ECS Task Definition Family found."
            echo "ECS_RESOURCES_EXIST=true" >> $GITHUB_OUTPUT
          fi
        if: always()

      - name: Deploy if ECS Resources Exist
        if: steps.check-td.outputs.ECS_RESOURCES_EXIST == 'true'
        run: |
          TASK_DEFINITION_NAME=${{ matrix.service }}
          
          # The image URI is passed from the build job's output
          IMAGE_URI="${{ needs.build.outputs[matrix.service].IMAGE_FULL_URI }}"
          
          # 1. Get the latest active task definition ARN
          TASK_DEF_ARN=$(aws ecs describe-task-definition --task-definition $TASK_DEFINITION_NAME --region ${{ env.AWS_REGION }} --query 'taskDefinition.taskDefinitionArn' --output text)

          # 2. Render new task definition JSON with the new image URI
          aws ecs describe-task-definition \
            --task-definition $TASK_DEF_ARN \
            --region ${{ env.AWS_REGION }} \
            | jq --arg IMG_URI "$IMAGE_URI" \
                 '.taskDefinition | .containerDefinitions |= map(if .name == "' + TASK_DEFINITION_NAME + '" then .image = $IMG_URI else . end) | 
                 del(.taskDefinitionArn) | del(.revision) | del(.status) | del(.requiresAttributes)' \
            > rendered-task-definition.json

          # 3. Register New Task Definition
          NEW_TD_ARN=$(aws ecs register-task-definition \
            --region ${{ env.AWS_REGION }} \
            --cli-input-json file://rendered-task-definition.json \
            | jq -r '.taskDefinition.taskDefinitionArn')
          
          echo "Registered new task definition: $NEW_TD_ARN"

          # 4. Force ECS Service Deployment
          echo "Updating ECS service: ${{ matrix.service }}-service"
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --service ${{ matrix.service }}-service \
            --task-definition $NEW_TD_ARN \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

          echo "Deployment initiated successfully for ${{ matrix.service }}."