AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: >
  An AWS Lambda function that resizes images from a source S3 bucket and saves them to a destination bucket.

Parameters:
  SourceBucketName:
    Type: String
    Description: The name of the S3 bucket where original images will be uploaded.

  DestinationBucketName:
    Type: String
    Description: The name of the S3 bucket where resized images will be saved.

Resources:
  SourceS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Ref SourceBucketName

  DestinationS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Ref DestinationBucketName

  ImageResizerFunction:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: app.lambda_handler
      Runtime: python3.9
      CodeUri: hello_world/
      Description: Resizes images uploaded to an S3 bucket.
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          DESTINATION_BUCKET: !Ref DestinationBucketName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref SourceBucketName
        - S3WritePolicy:
            BucketName: !Ref DestinationBucketName
      Events:
        S3Trigger:
          Type: S3
          Properties:
            Bucket: !Ref SourceS3Bucket   # ✅ use the resource, not parameter
            Events: s3:ObjectCreated:*
